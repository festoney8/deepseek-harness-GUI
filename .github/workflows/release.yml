name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: deepseek-harness-gui
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get release version
        shell: bash
        run: |
          version=${{ github.ref_name }}
          echo "RELEASE_VERSION=${version#v}" >> "$GITHUB_ENV"

      - name: Build NSIS setup executable
        run: pnpm run build:installer

      - name: Build portable executable
        run: pnpm run build:portable

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/${{ env.APP_NAME }}_${{ env.RELEASE_VERSION }}_x64-installer.exe
            src-tauri/target/release/bundle/portable/${{ env.APP_NAME }}_${{ env.RELEASE_VERSION }}_x64-portable.exe
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装包说明
            - 安装版：${{ env.APP_NAME }}_${{ env.RELEASE_VERSION }}_x64-setup.exe
            - 便携版：${{ env.APP_NAME }}_${{ env.RELEASE_VERSION }}_x64-portable.exe
          files: |
            src-tauri/target/release/bundle/nsis/${{ env.APP_NAME }}_${{ env.RELEASE_VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/portable/${{ env.APP_NAME }}_${{ env.RELEASE_VERSION }}_x64-portable.exe
